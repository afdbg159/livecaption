name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_HOME: /opt/gradle-8.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 展开源码包
        run: |
          set -e
          if [ -f source.zip ]; then
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -q source.zip -d /tmp/src
            ROOT="$(dirname "$(find /tmp/src -name settings.gradle.kts | head -n 1)")"
            echo "源码根目录：$ROOT"
            cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/
            rm -f source.zip
          fi
          rm -f local.properties gradlew gradlew.bat
          rm -rf gradle/wrapper
          echo "=== 项目关键文件 ==="
          find . -name "*.gradle.kts" -o -name "AndroidManifest.xml" | head
          ls -la

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（命令行工具 + android-34）
        run: |
          set -e
          sudo mkdir -p "$ANDROID_SDK_ROOT"
          sudo chown -R "$USER":"$USER" "$ANDROID_SDK_ROOT"
          cd /tmp
          curl -sSL --retry 3 -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf cmdline-tools
          unzip -q cmdline-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cp -a cmdline-tools/. "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          chmod +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/"*
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- 已安装 ---"
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

      - name: 安装 Gradle 8.7
        run: |
          curl -sSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo rm -rf "$GRADLE_HOME"
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod +x "$GRADLE_HOME/bin/gradle"
          "$GRADLE_HOME/bin/gradle" --version

      # 直接用系统 Gradle 编译，不生成/使用 gradlew（wrapper 步骤在云端容易失败）
      - name: 编译 Debug APK
        run: |
          export PATH="$GRADLE_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          java -version
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
          echo "=== 产物 ==="
          find app/build/outputs -type f -name "*.apk" || true

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaption-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: 发布到 Release（手机可直接下载安装）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "实时中文字幕 $TAG" \
              --notes "GitHub Actions 自动编译的 Debug APK，下载后直接安装即可。"
          fi

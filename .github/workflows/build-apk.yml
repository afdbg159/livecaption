name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 手机上无法上传整个目录，允许直接上传一个源码 zip，这里自动展开
      - name: 展开源码包
        run: |
          set -e
          if [ -f source.zip ]; then
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -q source.zip -d /tmp/src
            ROOT="$(dirname "$(find /tmp/src -name settings.gradle.kts | head -n 1)")"
            echo "源码根目录：$ROOT"
            cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/
            rm -f source.zip
          fi
          rm -f local.properties
          ls -la

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaption-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: 发布到 Release（手机可直接下载安装）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "实时中文字幕 $TAG" \
              --notes "GitHub Actions 自动编译的 Debug APK，下载后直接安装即可。"
          fi
